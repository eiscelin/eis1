<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d29;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --danger: #e74c3c;
      --success: #00b894;
      --text: #f5f5f5;
      --muted: #8e8e93;
      --border: #2a2d3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timer-card {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      width: min(440px, 92vw);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 32px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .display {
      font-size: 72px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin-bottom: 36px;
      transition: color .3s;
    }
    .display.alert { color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .inputs {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .input-group input {
      width: 72px;
      padding: 10px 4px;
      font-size: 20px;
      text-align: center;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      outline: none;
      transition: border-color .2s;
    }
    .input-group input:focus { border-color: var(--accent); }
    .input-group input::-webkit-inner-spin-button { display: none; }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .15s, opacity .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="timer-card">
    <h1>Countdown Timer</h1>
    <div class="display" id="display">00:00:00</div>
    <div class="inputs" id="inputs">
      <div class="input-group">
        <label for="hours">Hours</label>
        <input type="number" id="hours" min="0" max="99" value="0" />
      </div>
      <div class="input-group">
        <label for="minutes">Minutes</label>
        <input type="number" id="minutes" min="0" max="59" value="5" />
      </div>
      <div class="input-group">
        <label for="seconds">Seconds</label>
        <input type="number" id="seconds" min="0" max="59" value="0" />
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Start</button>
      <button class="btn btn-secondary" id="resetBtn" disabled>Reset</button>
    </div>
  </div>
  <script>
    (function() {
      var display = document.getElementById('display');
      var startBtn = document.getElementById('startBtn');
      var resetBtn = document.getElementById('resetBtn');
      var inputs = document.getElementById('inputs');
      var hoursInput = document.getElementById('hours');
      var minutesInput = document.getElementById('minutes');
      var secondsInput = document.getElementById('seconds');

      var totalSeconds = 0;
      var remaining = 0;
      var intervalId = null;
      var running = false;

      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      function format(s) {
        var h = Math.floor(s / 3600);
        var m = Math.floor((s % 3600) / 60);
        var sec = s % 60;
        return pad(h) + ':' + pad(m) + ':' + pad(sec);
      }

      function updateDisplay() {
        display.textContent = format(remaining);
        if (remaining === 0 && running) {
          display.classList.add('alert');
        } else {
          display.classList.remove('alert');
        }
      }

      function readInputs() {
        var h = parseInt(hoursInput.value, 10) || 0;
        var m = parseInt(minutesInput.value, 10) || 0;
        var s = parseInt(secondsInput.value, 10) || 0;
        return h * 3600 + m * 60 + s;
      }

      function setRunning(isRunning) {
        running = isRunning;
        if (isRunning) {
          startBtn.textContent = 'Pause';
          inputs.style.display = 'none';
          resetBtn.disabled = false;
        } else {
          startBtn.textContent = remaining > 0 && remaining < totalSeconds ? 'Resume' : 'Start';
          inputs.style.display = 'flex';
        }
      }

      function tick() {
        if (remaining <= 0) {
          clearInterval(intervalId);
          intervalId = null;
          setRunning(false);
          display.classList.add('alert');
          if (navigator.vibrate) navigator.vibrate(200);
          return;
        }
        remaining--;
        updateDisplay();
      }

      startBtn.addEventListener('click', function() {
        if (running) {
          clearInterval(intervalId);
          intervalId = null;
          setRunning(false);
          return;
        }
        if (remaining <= 0) {
          totalSeconds = readInputs();
          remaining = totalSeconds;
          if (remaining === 0) return;
        }
        setRunning(true);
        updateDisplay();
        intervalId = setInterval(tick, 1000);
      });

      resetBtn.addEventListener('click', function() {
        clearInterval(intervalId);
        intervalId = null;
        remaining = 0;
        totalSeconds = 0;
        display.classList.remove('alert');
        updateDisplay();
        setRunning(false);
        startBtn.textContent = 'Start';
      });
    })();
  </script>
</body>
</html>
