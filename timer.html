<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer — Chookee Inasal</title>
  <style>
    :root{
      --red:#e51b23;
      --deep-red:#a90f16;
      --yellow:#ffc400;
      --orange:#ff8a00;
      --cream:#fffaf0;
      --ink:#191919;
      --muted:#6f6f6f;
      --line:#ece7dc;
      --white:#fff;
      --green:#14833b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--cream);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    a{text-decoration:none;color:inherit}
    .card{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:0 18px 50px rgba(48,28,8,.12);
      padding:48px 40px;
      width:min(440px,92%);
      text-align:center;
    }
    h1{
      font-size:22px;
      font-weight:900;
      margin:0 0 8px;
      letter-spacing:-.3px;
    }
    .sub{color:var(--muted);font-size:14px;margin:0 0 32px}
    .display{
      font-size:72px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:-2px;
      margin:0 0 28px;
      color:var(--ink);
    }
    .display.running{color:var(--red)}
    .display.done{color:var(--green)}
    .inputs{
      display:flex;
      gap:8px;
      justify-content:center;
      margin-bottom:24px;
    }
    .field{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }
    .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .field input{
      width:64px;
      padding:10px 8px;
      font-size:20px;
      font-weight:700;
      text-align:center;
      border:2px solid var(--line);
      border-radius:12px;
      background:var(--cream);
      color:var(--ink);
      outline:none;
    }
    .field input:focus{border-color:var(--red)}
    .controls{display:flex;gap:10px;justify-content:center}
    .btn{
      border:none;
      border-radius:12px;
      padding:14px 28px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      transition:transform .08s ease,opacity .15s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn-red{background:var(--red);color:#fff}
    .btn-red:hover{background:var(--deep-red)}
    .btn-outline{background:transparent;border:2px solid var(--line);color:var(--ink)}
    .btn-outline:hover{border-color:var(--ink)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .back{
      margin-top:24px;
      font-size:14px;
      font-weight:700;
      color:var(--red);
    }
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <h1>Timer</h1>
    <p class="sub">Set a duration and start the countdown</p>

    <div class="inputs">
      <div class="field">
        <label>Min</label>
        <input id="min" type="number" min="0" max="999" value="0" inputmode="numeric" />
      </div>
      <div class="field">
        <label>Sec</label>
        <input id="sec" type="number" min="0" max="59" value="30" inputmode="numeric" />
      </div>
    </div>

    <div class="display" id="display">00:30</div>

    <div class="controls">
      <button class="btn btn-red" id="startBtn">Start</button>
      <button class="btn btn-outline" id="resetBtn" disabled>Reset</button>
    </div>

    <a class="back" href="/dikang1">← Back to home</a>
  </div>

  <script>
    const minEl = document.getElementById('min');
    const secEl = document.getElementById('sec');
    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    let remaining = 0;
    let total = 0;
    let interval = null;
    let running = false;

    function pad(n){ return String(n).padStart(2,'0'); }
    function format(s){ return pad(Math.floor(s/60)) + ':' + pad(s%60); }

    function render(){
      display.textContent = format(remaining);
      display.className = 'display' + (running ? ' running' : (remaining === 0 && total > 0 ? ' done' : ''));
    }

    function readInput(){
      const m = Math.max(0, Math.min(999, parseInt(minEl.value) || 0));
      const s = Math.max(0, Math.min(59, parseInt(secEl.value) || 0));
      return m*60 + s;
    }

    function setInputsEnabled(enabled){
      minEl.disabled = !enabled;
      secEl.disabled = !enabled;
    }

    function tick(){
      remaining--;
      render();
      if(remaining <= 0){
        clearInterval(interval);
        interval = null;
        running = false;
        startBtn.textContent = 'Start';
        startBtn.disabled = false;
        resetBtn.disabled = false;
        setInputsEnabled(true);
        render();
      }
    }

    startBtn.addEventListener('click', () => {
      if(running){
        clearInterval(interval);
        interval = null;
        running = false;
        startBtn.textContent = 'Resume';
        render();
        return;
      }
      // starting or resuming
      if(remaining <= 0){
        remaining = readInput();
        total = remaining;
        if(remaining <= 0) return;
      }
      running = true;
      setInputsEnabled(false);
      startBtn.textContent = 'Pause';
      resetBtn.disabled = false;
      render();
      interval = setInterval(tick, 1000);
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(interval);
      interval = null;
      running = false;
      remaining = readInput();
      total = remaining;
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      resetBtn.disabled = total === 0;
      setInputsEnabled(true);
      render();
    });

    // update display as user types
    [minEl, secEl].forEach(el => el.addEventListener('input', () => {
      if(!running){
        remaining = readInput();
        total = remaining;
        resetBtn.disabled = total === 0;
        render();
      }
    }));

    render();
  </script>
</body>
</html>
