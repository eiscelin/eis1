services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    stdin_open: true
    tty: true

volumes:
  node_modules:
